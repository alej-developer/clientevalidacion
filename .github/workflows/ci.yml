name: CI - Lint, Types and Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff - Lint and Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: Verificar estilo con Ruff
        run: ruff check . --output-format=github

      - name: Verificar formato con Ruff
        run: ruff format . --check

  types:
    name: mypy - Verificacion de tipos
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: Comprobar tipos con mypy
        run: mypy app --ignore-missing-imports

  tests:
    name: Tests - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: Crear archivo .env para pruebas
        run: |
          cat > .env << 'EOF'
          APP_NOMBRE="ClienteValidacion API"
          APP_VERSION="0.2.0"
          APP_DEBUG=false
          BD_URL="sqlite+aiosqlite:///./test_ci.db"
          CORS_ORIGENES='["http://localhost:3000"]'
          JWT_SECRETO="clave-secreta-para-ci-cd-de-32-caracteres-minimo"
          JWT_EXPIRACION_MINUTOS=60
          LIMITE_POR_DEFECTO="60/minute"
          LIMITE_AUTH="10/minute"
          LOG_NIVEL="WARNING"
          EOF

      - name: Ejecutar migraciones
        run: python -m alembic upgrade head
        env:
          BD_URL: "sqlite+aiosqlite:///./test_ci.db"

      - name: Ejecutar suite de pruebas
        run: pytest -v --tb=short

      - name: Limpiar base de datos temporal
        if: always()
        run: rm -f test_ci.db
