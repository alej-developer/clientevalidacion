name: 🚀 CI — Lint · Types · Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancelar ejecuciones previas del mismo PR para ahorrar minutos
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: Linting con Ruff
  # ─────────────────────────────────────────────────────────────
  lint:
    name: 🔍 Ruff — Lint & Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias de desarrollo
        run: pip install -e ".[dev]"

      - name: Ruff — verificar estilo de código
        run: ruff check . --output-format=github

      - name: Ruff — verificar formato
        run: ruff format . --check

  # ─────────────────────────────────────────────────────────────
  # Job 2: Verificación de tipos con mypy
  # ─────────────────────────────────────────────────────────────
  types:
    name: 🔬 mypy — Verificación de tipos
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias de desarrollo
        run: pip install -e ".[dev]"

      - name: mypy — verificar tipos
        run: mypy app --ignore-missing-imports

  # ─────────────────────────────────────────────────────────────
  # Job 3: Tests de integración con matriz de versiones Python
  # ─────────────────────────────────────────────────────────────
  tests:
    name: 🧪 Tests — Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Instalar dependencias de desarrollo
        run: pip install -e ".[dev]"

      - name: Crear archivo .env para tests
        run: |
          cat > .env << 'EOF'
          APP_NOMBRE="ClienteValidacion API"
          APP_VERSION="0.2.0"
          APP_DEBUG=false
          BD_URL="sqlite+aiosqlite:///./test_ci.db"
          CORS_ORIGENES='["http://localhost:3000"]'
          JWT_SECRETO="clave-secreta-para-ci-cd-de-32-caracteres-minimo"
          JWT_EXPIRACION_MINUTOS=60
          LOG_NIVEL="WARNING"
          EOF

      - name: Ejecutar migraciones sobre BD de test
        run: python -m alembic upgrade head
        env:
          BD_URL: "sqlite+aiosqlite:///./test_ci.db"

      - name: Ejecutar tests con pytest
        run: pytest -v --tb=short

      - name: Limpiar BD de test
        if: always()
        run: rm -f test_ci.db
