[project]
name = "clientevalidacion"
version = "0.2.0"
description = "API REST profesional construida con FastAPI, arquitectura limpia y DDD simplificado"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.143.2",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "sqlalchemy[asyncio]==2.1.4",
    "aiosqlite==0.22.1",
    "alembic==1.20.0",
    "httpx==0.28.1",
    "python-jose[cryptography]==3.5.0",
    "python-multipart==0.0.32",
    "slowapi==0.1.10",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "mypy==2.4.0",
    "ruff==0.17.1",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# Solo `app` es paquete instalable. Alembic vive en el repo como migraciones,
# no como distribución (evita "Multiple top-level packages").
[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff]
target-version = "py311"
line-length = 100
# Excluir archivos autogenerados por Alembic
exclude = ["alembic/versions/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
# N818: nombres de excepciones en espanol
# B904: excepciones propias sin raise from
# SIM108: preferencia de operador ternario
ignore = ["N818", "B904", "SIM108"]
